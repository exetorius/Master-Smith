# Master Smith in two containers: the Python API + worker (with headless Blender) and the Next.js chat.
#   cp .env.example .env      # put FAL_KEY and OPENROUTER_API_KEY in it
#   docker compose up --build
#   open http://localhost:3000
# Builds, uploads and the spend ledger persist in the mastersmith-data volume.
services:
  api:
    build: .
    restart: unless-stopped        # comes back on its own when Docker starts after a reboot
    env_file: .env
    environment:
      MASTERSMITH_DATA: /data
    volumes:
      - mastersmith-data:/data
    ports:
      - "127.0.0.1:8080:8080"    # this machine only: the API spends your provider credit
    # Cycles CPU renders and decimation want cores and memory; raise these on a big machine.
    deploy:
      resources:
        limits:
          memory: 8g

  web:
    build: ./web
    restart: unless-stopped
    environment:
      MASTERSMITH_API_URL: http://api:8080
      MASTERSMITH_API_KEY: ${MASTERSMITH_API_KEY:-}   # the fixed key from .env, if you set one
      MASTERSMITH_WEB_PASSWORD: ${MASTERSMITH_WEB_PASSWORD:-}   # the chat asks for it when set (web/proxy.ts)
    ports:
      - "127.0.0.1:3000:3000"    # this machine only: the chat has no login of its own
    depends_on:
      - api

volumes:
  mastersmith-data:
